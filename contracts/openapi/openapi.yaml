components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: OpaquePaperSession
    adminID:
      type: apiKey
      in: header
      name: X-Admin-ID
      description: Synthetic local admin identity. Production requires isolated enterprise SSO.
    adminRole:
      type: apiKey
      in: header
      name: X-Admin-Role
      description: Synthetic local role used for permission tests.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Stable key reused only for retries of the same financial command.
      schema:
        type: string
        minLength: 8
        maxLength: 256
        pattern: "^[a-zA-Z0-9][a-zA-Z0-9._:-]{7,255}$"
    OrderID:
      name: order_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Symbol:
      name: symbol
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Symbol"
    PageSize:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 20
    CaseID:
      name: case_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProposalID:
      name: proposal_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CardID:
      name: card_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    StatementID:
      name: statement_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DisputeID:
      name: dispute_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    InvalidRequest:
      description: The request did not pass schema or domain validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unauthorized:
      description: A valid paper session bearer token is required.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Forbidden:
      description: This capability is disabled in the current environment.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: The requested resource was not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Conflict:
      description: Idempotency, replay, quote, or order state conflict.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unprocessable:
      description: The account or instrument cannot execute this order.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unavailable:
      description: Required simulated market data is unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ProviderTimeout:
      description: The paper broker timed out; retry with the same idempotency key.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    Decimal:
      type: string
      description: Exact decimal string; JSON numbers and floating-point values are not accepted.
      pattern: "^-?(0|[1-9][0-9]{0,19})(\\.[0-9]{1,18})?$"
      examples: ["190.1"]
    Symbol:
      type: string
      pattern: "^[A-Z][A-Z0-9.-]{0,15}$"
      examples: [AAPL]
    QuoteStatus:
      type: string
      enum: [REAL_TIME, DELAYED, INDICATIVE, SIMULATED, STALE, UNAVAILABLE]
    HealthResponse:
      type: object
      additionalProperties: false
      required: [service, status, environment, time]
      properties:
        service:
          type: string
          const: api
        status:
          type: string
          const: ok
        environment:
          type: string
          enum: [local, test, staging, production]
        time:
          type: string
          format: date-time
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              pattern: "^[A-Z][A-Z0-9_]{2,63}$"
            message:
              type: string
            next_action:
              type: string
    PaperRegistrationRequest:
      type: object
      additionalProperties: false
      required: [fixture_id]
      properties:
        fixture_id:
          type: string
          minLength: 3
          maxLength: 128
          pattern: "^[a-z][a-z0-9._:-]{2,127}$"
    PaperRegistrationResponse:
      type: object
      additionalProperties: false
      required: [account, access_token, mode, replayed]
      properties:
        account:
          $ref: "#/components/schemas/PaperAccount"
        access_token:
          type: string
          minLength: 32
        mode:
          type: string
          const: SIMULATED
        replayed:
          type: boolean
    PaperAccount:
      type: object
      additionalProperties: false
      required: [id, fixture_id, customer_reference, initial_cash, created_at]
      properties:
        id:
          type: string
          format: uuid
        fixture_id:
          type: string
        customer_reference:
          type: string
        initial_cash:
          $ref: "#/components/schemas/Decimal"
        created_at:
          type: string
          format: date-time
    InstrumentCapability:
      type: object
      additionalProperties: false
      required:
        [
          searchable,
          quote_enabled,
          paper_tradable,
          live_tradable,
          fractional_enabled,
          transfer_out_enabled,
          rwa_mint_enabled,
          user_eligible,
          disabled_reason,
          policy_version,
        ]
      properties:
        searchable:
          type: boolean
        quote_enabled:
          type: boolean
        paper_tradable:
          type: boolean
        live_tradable:
          type: boolean
        fractional_enabled:
          type: boolean
        transfer_out_enabled:
          type: boolean
        rwa_mint_enabled:
          type: boolean
        user_eligible:
          type: boolean
        disabled_reason:
          type: [string, "null"]
        policy_version:
          type: string
    Instrument:
      type: object
      additionalProperties: false
      required:
        [
          id,
          symbol,
          display_name,
          asset_type,
          primary_exchange,
          currency,
          listed,
          capability,
        ]
      properties:
        id:
          type: string
          format: uuid
        symbol:
          $ref: "#/components/schemas/Symbol"
        display_name:
          type: string
        asset_type:
          type: string
          enum:
            [
              COMMON_STOCK,
              ETF,
              ADR,
              REIT,
              PREFERRED,
              CLOSED_END_FUND,
              ETN,
              WARRANT,
              UNIT,
