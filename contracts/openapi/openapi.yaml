openapi: 3.1.0
info:
  title: Cytisus API
  version: 0.6.0
  description: Shared client contract for deterministic Paper Securities, simulated banking, custodial simulated Crypto, and the simulated Card MVP.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: https://api.{environment}.cytisus.invalid
    description: Environment placeholder; a real production domain requires human approval.
    variables:
      environment:
        default: local
        enum: [local, test, staging, production]
tags:
  - name: Operations
    description: Process health and operational readiness.
  - name: Paper registration
    description: Synthetic, non-production account fixtures.
  - name: Market data
    description: Searchable instruments and honestly labeled quote fixtures.
  - name: Paper orders
    description: Idempotent simulated order and replay commands.
  - name: Portfolio
    description: Ledger-backed cash dimensions and fill-derived positions.
  - name: Bank accounts
    description: Synthetic same-name ownership and closed-loop bank account controls.
  - name: Bank transfers
    description: Simulated ACH, USD Wire, and bank withdrawal state machines.
  - name: Compliance admin
    description: Isolated local admin review, maker-checker, and reconciliation controls.
  - name: Crypto
    description: Custodial simulated crypto assets, USD conversions, portfolio, deposits, and withdrawals.
  - name: Card
    description: Simulated Card lifecycle, spending power, transactions, disputes, statements, and notifications.
  - name: Card admin
    description: Isolated Card operations, dispute review, physical lifecycle, and reconciliation controls.
  - name: Simulators
    description: Explicitly simulated provider events available only in local and test environments.
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Return API process health
      security: []
      tags: [Operations]
      responses:
        "200":
          description: API process is healthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "405":
          description: The endpoint only accepts GET requests.
  /v1/paper/registrations:
    post:
      operationId: registerPaperFixture
      summary: Create or replay a synthetic paper registration fixture
      description: Available only in local and test environments. The returned bearer token represents synthetic data and must be kept in memory by clients.
      security: []
      tags: [Paper registration]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaperRegistrationRequest"
      responses:
        "200":
          description: Existing fixture replayed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaperRegistrationResponse"
        "201":
          description: Paper fixture created and funded through the Ledger.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaperRegistrationResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/instruments:
    get:
      operationId: searchInstruments
      summary: Search U.S. listed instrument fixtures and capabilities
      security: []
      tags: [Market data]
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Instruments and their explicit paper-trading capabilities.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Instrument"
        "400":
          $ref: "#/components/responses/InvalidRequest"
  /v1/market-data/quotes/{symbol}:
    get:
      operationId: getQuote
      summary: Return a labeled deterministic quote
      description: The Paper Securities provider emits SIMULATED, STALE, or UNAVAILABLE; it never claims real-time data.
      security: []
      tags: [Market data]
      parameters:
        - $ref: "#/components/parameters/Symbol"
        - name: replay_cursor
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
      responses:
        "200":
          description: Quote with source status and observation time.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/orders:
    get:
      operationId: listPaperOrders
      summary: List paper orders and fills
      tags: [Paper orders]
      parameters:
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Authenticated paper account orders.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Order"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: submitPaperOrder
      summary: Submit a market or limit paper order
      description: Common stocks and ETFs are tradable. The initial deterministic execution may be a partial fill.
      tags: [Paper orders]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitOrderRequest"
      responses:
        "201":
          description: Order accepted by the simulated broker.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "503":
          $ref: "#/components/responses/Unavailable"
        "504":
          $ref: "#/components/responses/ProviderTimeout"
  /v1/orders/{order_id}/replay:
    post:
      operationId: advancePaperOrderReplay
      summary: Advance one deterministic broker replay step
      tags: [Paper orders]
      parameters:
        - $ref: "#/components/parameters/OrderID"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Updated order after one deterministic replay step.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "504":
          $ref: "#/components/responses/ProviderTimeout"
  /v1/orders/{order_id}/cancel:
    post:
      operationId: cancelPaperOrder
      summary: Cancel an open or partially filled paper order
      tags: [Paper orders]
      parameters:
        - $ref: "#/components/parameters/OrderID"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Cancelled order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/positions:
    get:
      operationId: listPaperPositions
      summary: List fill-derived positions with simulated valuation
      tags: [Portfolio]
      responses:
        "200":
          description: Current non-zero paper positions.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Position"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/portfolio:
    get:
      operationId: getPaperPortfolio
      summary: Return Ledger-backed cash dimensions and fill-derived positions
      tags: [Portfolio]
      responses:
        "200":
          description: Paper portfolio. Provisional buying power is intentionally separate from settled and withdrawable cash.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Portfolio"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/banks/accounts:
    get:
      operationId: listBankAccounts
      summary: List synthetic bank accounts in withdrawal preference order
      tags: [Bank accounts]
      responses:
        "200":
          description: Accounts funded successfully appear before new accounts.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, mode]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/BankAccount"
                  mode:
                    type: string
                    const: SIMULATED
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: linkBankAccount
      summary: Link a synthetic bank account for ownership verification
      tags: [Bank accounts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkBankAccountRequest"
      responses:
        "201":
          description: Synthetic bank account linked. New same-name accounts remain pending until ownership verification.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankAccount"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/transfers/funding:
    get:
      operationId: listBankFundingTransfers
      summary: List simulated ACH and USD Wire funding transfers
      tags: [Bank transfers]
      parameters:
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Funding transfers with explicit unsettled or settled state.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, mode]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/FundingTransfer"
                  mode:
                    type: string
                    const: SIMULATED
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: initiateBankFunding
      summary: Initiate simulated ACH or issue USD Wire instructions
      description: ACH starts in pending and cannot increase settled, withdrawable, crypto, or card-spendable cash before settlement. Wire credits only after confirmed receipt and ownership checks.
      tags: [Bank transfers]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InitiateFundingRequest"
      responses:
        "201":
          description: Simulated funding transfer created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FundingTransfer"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "504":
          $ref: "#/components/responses/ProviderTimeout"
  /v1/transfers/withdrawals:
    get:
      operationId: listBankWithdrawals
      summary: List closed-loop withdrawal requests and next actions
      tags: [Bank transfers]
      parameters:
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Withdrawals with user-safe reason codes, cooling dates, and next actions.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, mode]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/BankWithdrawal"
                  mode:
                    type: string
                    const: SIMULATED
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: requestBankWithdrawal
      summary: Request a closed-loop same-name bank withdrawal
      description: Omitting bank_account_id selects the most recently successful same-name funding account. Third-party withdrawals are permanently disabled in MVP.
      tags: [Bank transfers]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BankWithdrawalRequest"
      responses:
        "201":
          description: Withdrawal created in its applicable security, review, approval, or bank state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankWithdrawal"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "504":
          $ref: "#/components/responses/ProviderTimeout"
  /internal/v1/simulators/bank/events:
    post:
      operationId: applySimulatedBankEvent
      summary: Apply a deterministic local bank provider event
      description: Local/test only. Duplicate provider and external event identifiers replay without repeating Ledger effects.
      security: []
      tags: [Simulators]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SimulatedBankEventRequest"
      responses:
        "200":
          description: Updated bank account, funding transfer, or withdrawal.
          content:
            application/json:
              schema:
                type: object
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "409":
          $ref: "#/components/responses/Conflict"
  /internal/v1/admin/compliance/cases:
    get:
      operationId: listBankComplianceCases
      summary: List bank withdrawal and transaction-monitoring cases
      security:
        - adminID: []
          adminRole: []
      tags: [Compliance admin]
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Authorized admin case queue.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ComplianceCase"
        "403":
          $ref: "#/components/responses/Forbidden"
  /internal/v1/admin/compliance/cases/{case_id}/proposals:
    post:
      operationId: proposeBankCaseReview
      summary: Create an evidenced maker proposal for a bank case
      security:
        - adminID: []
          adminRole: []
      tags: [Compliance admin]
      parameters:
        - $ref: "#/components/parameters/CaseID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewProposalRequest"
      responses:
        "201":
          description: Proposal awaiting an independent checker.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewProposal"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /internal/v1/admin/compliance/proposals/{proposal_id}/decisions:
    post:
      operationId: decideBankCaseReview
      summary: Independently approve or reject a maker proposal
      security:
        - adminID: []
          adminRole: []
      tags: [Compliance admin]
      parameters:
        - $ref: "#/components/parameters/ProposalID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewDecisionRequest"
      responses:
        "200":
          description: Recorded checker decision and, when approved, transactional withdrawal effect.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewProposal"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /internal/v1/admin/reconciliation/banks:
    post:
      operationId: reconcileBankCash
      summary: Reconcile bank provider totals to banking-related Ledger cash
      security:
        - adminID: []
          adminRole: []
      tags: [Compliance admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BankReconciliationRequest"
      responses:
        "200":
          description: Reconciliation result. Differences remain visible and create a compliance case.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankReconciliation"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/crypto/assets:
    get:
      operationId: listCryptoAssets
      summary: List tradable simulated crypto assets and native networks
      security: []
      tags: [Crypto]
      responses:
        "200":
          description: The twelve simulator assets. USD is the only quote and settlement currency.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CryptoAssetList"
        "400":
          $ref: "#/components/responses/InvalidRequest"
  /v1/crypto/portfolio:
    get:
      operationId: getCryptoPortfolio
      summary: Return Ledger-backed custodial crypto balances
      tags: [Crypto]
      responses:
        "200":
          description: Settled, held, and review-frozen quantities by asset.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CryptoPortfolio"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/crypto/conversions:
    get:
      operationId: listCryptoConversions
      summary: List simulated crypto conversions and explicit USD legs
      tags: [Crypto]
      parameters:
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Recent conversions with venue children, fills, fees, and price improvement.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, mode]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/CryptoConversion"
                  mode:
                    type: string
                    const: SIMULATED
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createCryptoConversion
      summary: Convert USD and crypto through executable simulated USD venues
      description: Crypto-to-crypto requests create a crypto-to-USD sell leg and a separate USD-to-crypto buy leg. Coin-to-coin venue pairs do not exist.
      tags: [Crypto]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CryptoConversionRequest"
      responses:
        "200":
          description: An idempotent replay of the original conversion.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CryptoConversion"
        "201":
          description: Conversion routed and settled through Ledger.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CryptoConversion"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "504":
          $ref: "#/components/responses/ProviderTimeout"
  /v1/crypto/conversions/{conversion_id}:
    get:
      operationId: getCryptoConversion
      summary: Get one simulated crypto conversion
      tags: [Crypto]
      parameters:
        - name: conversion_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Conversion, explicit USD legs, child orders, and fills.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CryptoConversion"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/crypto/deposit-addresses:
    get:
      operationId: listCryptoDepositAddresses
      summary: List simulated custodial deposit addresses
      tags: [Crypto]
      responses:
        "200":
          description: Active addresses generated by the custody simulator.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, mode]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/CryptoDepositAddress"
                  mode:
                    type: string
                    const: SIMULATED
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createCryptoDepositAddress
      summary: Create a simulated custodial deposit address
      tags: [Crypto]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CryptoAddressNetworkRequest"
      responses:
        "200":
          description: An idempotent replay of the existing address.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CryptoDepositAddress"
        "201":
          description: Simulated address created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CryptoDepositAddress"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/crypto/deposits:
    get:
      operationId: listCryptoDeposits
      summary: List custody deposit events and Ledger outcomes
      tags: [Crypto]
      parameters:
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Confirmed or rejected simulated deposits.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, mode]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/CryptoDeposit"
                  mode:
                    type: string
                    const: SIMULATED
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/crypto/withdrawal-addresses:
    get:
      operationId: listCryptoWithdrawalAddresses
      summary: List whitelisted crypto withdrawal addresses
      tags: [Crypto]
      responses:
        "200":
          description: Addresses with cooling, activation, and risk status.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, mode]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/CryptoWithdrawalAddress"
                  mode:
                    type: string
                    const: SIMULATED
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: addCryptoWithdrawalAddress
      summary: Add a crypto address with risk screening and dynamic cooling
      tags: [Crypto]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CryptoWithdrawalAddressRequest"
      responses:
        "200":
          description: An idempotent replay of the address request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CryptoWithdrawalAddress"
        "201":
          description: Address added in cooling or suspended state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CryptoWithdrawalAddress"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /v1/crypto/withdrawal-addresses/{address_id}/activate:
    post:
      operationId: activateCryptoWithdrawalAddress
      summary: Activate a cooled address after repeat risk screening
      tags: [Crypto]
      parameters:
        - name: address_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Address activated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CryptoWithdrawalAddress"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /v1/crypto/withdrawals:
    get:
      operationId: listCryptoWithdrawals
      summary: List simulated custodial withdrawals
      tags: [Crypto]
      parameters:
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Withdrawals with approval, broadcast, confirmation, or restored failure state.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, mode]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/CryptoWithdrawal"
                  mode:
                    type: string
                    const: SIMULATED
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: requestCryptoWithdrawal
      summary: Reserve a settled asset for simulated custodial withdrawal
      tags: [Crypto]
