openapi: 3.1.0
info:
  title: Cytisus API
  version: 0.4.0
  description: Shared client contract for deterministic Paper Securities plus simulated ACH, USD Wire, closed-loop bank withdrawals, compliance review, and reconciliation.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: https://api.{environment}.cytisus.invalid
    description: Environment placeholder; a real production domain requires human approval.
    variables:
      environment:
        default: local
        enum: [local, test, staging, production]
tags:
  - name: Operations
    description: Process health and operational readiness.
  - name: Paper registration
    description: Synthetic, non-production account fixtures.
  - name: Market data
    description: Searchable instruments and honestly labeled quote fixtures.
  - name: Paper orders
    description: Idempotent simulated order and replay commands.
  - name: Portfolio
    description: Ledger-backed cash dimensions and fill-derived positions.
  - name: Bank accounts
    description: Synthetic same-name ownership and closed-loop bank account controls.
  - name: Bank transfers
    description: Simulated ACH, USD Wire, and bank withdrawal state machines.
  - name: Compliance admin
    description: Isolated local admin review, maker-checker, and reconciliation controls.
  - name: Simulators
    description: Explicitly simulated provider events available only in local and test environments.
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Return API process health
      security: []
      tags: [Operations]
      responses:
        "200":
          description: API process is healthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "405":
          description: The endpoint only accepts GET requests.
  /v1/paper/registrations:
    post:
      operationId: registerPaperFixture
      summary: Create or replay a synthetic paper registration fixture
      description: Available only in local and test environments. The returned bearer token represents synthetic data and must be kept in memory by clients.
      security: []
      tags: [Paper registration]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaperRegistrationRequest"
      responses:
        "200":
          description: Existing fixture replayed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaperRegistrationResponse"
        "201":
          description: Paper fixture created and funded through the Ledger.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaperRegistrationResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/instruments:
    get:
      operationId: searchInstruments
      summary: Search U.S. listed instrument fixtures and capabilities
      security: []
      tags: [Market data]
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Instruments and their explicit paper-trading capabilities.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Instrument"
        "400":
          $ref: "#/components/responses/InvalidRequest"
  /v1/market-data/quotes/{symbol}:
    get:
      operationId: getQuote
      summary: Return a labeled deterministic quote
      description: The Paper Securities provider emits SIMULATED, STALE, or UNAVAILABLE; it never claims real-time data.
      security: []
      tags: [Market data]
      parameters:
        - $ref: "#/components/parameters/Symbol"
        - name: replay_cursor
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
      responses:
        "200":
          description: Quote with source status and observation time.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/orders:
    get:
      operationId: listPaperOrders
      summary: List paper orders and fills
      tags: [Paper orders]
      parameters:
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Authenticated paper account orders.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Order"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: submitPaperOrder
      summary: Submit a market or limit paper order
      description: Common stocks and ETFs are tradable. The initial deterministic execution may be a partial fill.
      tags: [Paper orders]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitOrderRequest"
      responses:
        "201":
          description: Order accepted by the simulated broker.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "503":
          $ref: "#/components/responses/Unavailable"
        "504":
          $ref: "#/components/responses/ProviderTimeout"
  /v1/orders/{order_id}/replay:
    post:
      operationId: advancePaperOrderReplay
      summary: Advance one deterministic broker replay step
      tags: [Paper orders]
      parameters:
        - $ref: "#/components/parameters/OrderID"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Updated order after one deterministic replay step.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "504":
          $ref: "#/components/responses/ProviderTimeout"
  /v1/orders/{order_id}/cancel:
    post:
      operationId: cancelPaperOrder
      summary: Cancel an open or partially filled paper order
      tags: [Paper orders]
      parameters:
        - $ref: "#/components/parameters/OrderID"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Cancelled order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/positions:
    get:
      operationId: listPaperPositions
      summary: List fill-derived positions with simulated valuation
      tags: [Portfolio]
      responses:
        "200":
          description: Current non-zero paper positions.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Position"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/portfolio:
    get:
      operationId: getPaperPortfolio
      summary: Return Ledger-backed cash dimensions and fill-derived positions
      tags: [Portfolio]
      responses:
        "200":
          description: Paper portfolio. Provisional buying power is intentionally separate from settled and withdrawable cash.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Portfolio"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/banks/accounts:
    get:
      operationId: listBankAccounts
      summary: List synthetic bank accounts in withdrawal preference order
      tags: [Bank accounts]
      responses:
        "200":
          description: Accounts funded successfully appear before new accounts.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, mode]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/BankAccount"
                  mode:
                    type: string
                    const: SIMULATED
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: linkBankAccount
      summary: Link a synthetic bank account for ownership verification
      tags: [Bank accounts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkBankAccountRequest"
      responses:
        "201":
          description: Synthetic bank account linked. New same-name accounts remain pending until ownership verification.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankAccount"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/transfers/funding:
    get:
      operationId: listBankFundingTransfers
      summary: List simulated ACH and USD Wire funding transfers
      tags: [Bank transfers]
      parameters:
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Funding transfers with explicit unsettled or settled state.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, mode]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/FundingTransfer"
                  mode:
                    type: string
                    const: SIMULATED
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: initiateBankFunding
      summary: Initiate simulated ACH or issue USD Wire instructions
      description: ACH starts in pending and cannot increase settled, withdrawable, crypto, or card-spendable cash before settlement. Wire credits only after confirmed receipt and ownership checks.
      tags: [Bank transfers]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InitiateFundingRequest"
      responses:
        "201":
          description: Simulated funding transfer created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FundingTransfer"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "504":
          $ref: "#/components/responses/ProviderTimeout"
  /v1/transfers/withdrawals:
    get:
      operationId: listBankWithdrawals
      summary: List closed-loop withdrawal requests and next actions
      tags: [Bank transfers]
      parameters:
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Withdrawals with user-safe reason codes, cooling dates, and next actions.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, mode]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/BankWithdrawal"
                  mode:
                    type: string
                    const: SIMULATED
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: requestBankWithdrawal
      summary: Request a closed-loop same-name bank withdrawal
      description: Omitting bank_account_id selects the most recently successful same-name funding account. Third-party withdrawals are permanently disabled in MVP.
      tags: [Bank transfers]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BankWithdrawalRequest"
      responses:
        "201":
          description: Withdrawal created in its applicable security, review, approval, or bank state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankWithdrawal"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "504":
          $ref: "#/components/responses/ProviderTimeout"
  /internal/v1/simulators/bank/events:
    post:
      operationId: applySimulatedBankEvent
      summary: Apply a deterministic local bank provider event
      description: Local/test only. Duplicate provider and external event identifiers replay without repeating Ledger effects.
      security: []
      tags: [Simulators]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SimulatedBankEventRequest"
      responses:
        "200":
          description: Updated bank account, funding transfer, or withdrawal.
          content:
            application/json:
              schema:
                type: object
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "409":
          $ref: "#/components/responses/Conflict"
  /internal/v1/admin/compliance/cases:
    get:
      operationId: listBankComplianceCases
      summary: List bank withdrawal and transaction-monitoring cases
      security:
        - adminID: []
          adminRole: []
      tags: [Compliance admin]
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Authorized admin case queue.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ComplianceCase"
        "403":
          $ref: "#/components/responses/Forbidden"
  /internal/v1/admin/compliance/cases/{case_id}/proposals:
    post:
      operationId: proposeBankCaseReview
      summary: Create an evidenced maker proposal for a bank case
      security:
        - adminID: []
          adminRole: []
      tags: [Compliance admin]
      parameters:
        - $ref: "#/components/parameters/CaseID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewProposalRequest"
      responses:
        "201":
          description: Proposal awaiting an independent checker.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewProposal"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /internal/v1/admin/compliance/proposals/{proposal_id}/decisions:
    post:
      operationId: decideBankCaseReview
      summary: Independently approve or reject a maker proposal
      security:
        - adminID: []
          adminRole: []
      tags: [Compliance admin]
      parameters:
        - $ref: "#/components/parameters/ProposalID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewDecisionRequest"
      responses:
        "200":
          description: Recorded checker decision and, when approved, transactional withdrawal effect.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewProposal"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /internal/v1/admin/reconciliation/banks:
    post:
      operationId: reconcileBankCash
      summary: Reconcile bank provider totals to banking-related Ledger cash
      security:
        - adminID: []
          adminRole: []
      tags: [Compliance admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BankReconciliationRequest"
      responses:
        "200":
          description: Reconciliation result. Differences remain visible and create a compliance case.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankReconciliation"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: OpaquePaperSession
    adminID:
      type: apiKey
      in: header
      name: X-Admin-ID
      description: Synthetic local admin identity. Production requires isolated enterprise SSO.
    adminRole:
      type: apiKey
      in: header
      name: X-Admin-Role
      description: Synthetic local role used for permission tests.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Stable key reused only for retries of the same financial command.
      schema:
        type: string
        minLength: 8
        maxLength: 256
        pattern: "^[a-zA-Z0-9][a-zA-Z0-9._:-]{7,255}$"
    OrderID:
      name: order_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Symbol:
      name: symbol
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Symbol"
    PageSize:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 20
    CaseID:
      name: case_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProposalID:
      name: proposal_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    InvalidRequest:
      description: The request did not pass schema or domain validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unauthorized:
      description: A valid paper session bearer token is required.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Forbidden:
      description: This capability is disabled in the current environment.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: The requested resource was not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Conflict:
      description: Idempotency, replay, quote, or order state conflict.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unprocessable:
      description: The account or instrument cannot execute this order.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unavailable:
      description: Required simulated market data is unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ProviderTimeout:
      description: The paper broker timed out; retry with the same idempotency key.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    Decimal:
      type: string
      description: Exact decimal string; JSON numbers and floating-point values are not accepted.
      pattern: "^-?(0|[1-9][0-9]{0,19})(\\.[0-9]{1,18})?$"
      examples: ["190.1"]
    Symbol:
      type: string
      pattern: "^[A-Z][A-Z0-9.-]{0,15}$"
      examples: [AAPL]
    QuoteStatus:
      type: string
      enum: [REAL_TIME, DELAYED, INDICATIVE, SIMULATED, STALE, UNAVAILABLE]
    HealthResponse:
      type: object
      additionalProperties: false
      required: [service, status, environment, time]
      properties:
        service:
          type: string
          const: api
        status:
          type: string
          const: ok
        environment:
          type: string
          enum: [local, test, staging, production]
        time:
          type: string
          format: date-time
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              pattern: "^[A-Z][A-Z0-9_]{2,63}$"
            message:
              type: string
            next_action:
              type: string
    PaperRegistrationRequest:
      type: object
      additionalProperties: false
      required: [fixture_id]
      properties:
        fixture_id:
          type: string
          minLength: 3
          maxLength: 128
          pattern: "^[a-z][a-z0-9._:-]{2,127}$"
    PaperRegistrationResponse:
      type: object
      additionalProperties: false
      required: [account, access_token, mode, replayed]
      properties:
        account:
          $ref: "#/components/schemas/PaperAccount"
        access_token:
          type: string
          minLength: 32
        mode:
          type: string
          const: SIMULATED
        replayed:
          type: boolean
    PaperAccount:
      type: object
      additionalProperties: false
      required: [id, fixture_id, customer_reference, initial_cash, created_at]
      properties:
        id:
          type: string
          format: uuid
        fixture_id:
          type: string
        customer_reference:
          type: string
        initial_cash:
          $ref: "#/components/schemas/Decimal"
        created_at:
          type: string
          format: date-time
    InstrumentCapability:
      type: object
      additionalProperties: false
      required:
        [
          searchable,
          quote_enabled,
          paper_tradable,
          live_tradable,
          fractional_enabled,
          transfer_out_enabled,
          rwa_mint_enabled,
          user_eligible,
          disabled_reason,
          policy_version,
        ]
      properties:
        searchable:
          type: boolean
        quote_enabled:
          type: boolean
        paper_tradable:
          type: boolean
        live_tradable:
          type: boolean
        fractional_enabled:
          type: boolean
        transfer_out_enabled:
          type: boolean
        rwa_mint_enabled:
          type: boolean
        user_eligible:
          type: boolean
        disabled_reason:
          type: [string, "null"]
        policy_version:
          type: string
    Instrument:
      type: object
      additionalProperties: false
      required:
        [
          id,
          symbol,
          display_name,
          asset_type,
          primary_exchange,
          currency,
          listed,
          capability,
        ]
      properties:
        id:
          type: string
          format: uuid
        symbol:
          $ref: "#/components/schemas/Symbol"
        display_name:
          type: string
        asset_type:
          type: string
          enum:
            [
              COMMON_STOCK,
              ETF,
              ADR,
              REIT,
              PREFERRED,
              CLOSED_END_FUND,
              ETN,
              WARRANT,
              UNIT,
              RIGHT,
              OTHER,
            ]
        primary_exchange:
          type: string
        currency:
          type: string
        listed:
          type: boolean
        capability:
          $ref: "#/components/schemas/InstrumentCapability"
    Quote:
      type: object
      additionalProperties: false
      required:
        [
          instrument_id,
          symbol,
          replay_cursor,
          bid,
          ask,
          last,
          status,
          market_status,
          observed_at,
          provider,
        ]
      properties:
        instrument_id:
          type: string
          format: uuid
        symbol:
          $ref: "#/components/schemas/Symbol"
        replay_cursor:
          type: integer
          format: int32
          minimum: 0
        bid:
          oneOf:
            - $ref: "#/components/schemas/Decimal"
            - type: "null"
        ask:
          oneOf:
            - $ref: "#/components/schemas/Decimal"
            - type: "null"
        last:
          oneOf:
            - $ref: "#/components/schemas/Decimal"
            - type: "null"
        status:
          $ref: "#/components/schemas/QuoteStatus"
        market_status:
          type: string
          enum: [PRE_MARKET, OPEN, AFTER_HOURS, CLOSED, HALTED]
        observed_at:
          type: string
          format: date-time
        provider:
          type: string
    SubmitOrderRequest:
      type: object
      additionalProperties: false
      required: [symbol, side, order_type, time_in_force, quantity]
      properties:
        symbol:
          $ref: "#/components/schemas/Symbol"
        side:
          type: string
          enum: [BUY, SELL]
        order_type:
          type: string
          enum: [MARKET, LIMIT]
        time_in_force:
          type: string
          enum: [DAY, GTC]
        quantity:
          $ref: "#/components/schemas/Decimal"
        limit_price:
          oneOf:
