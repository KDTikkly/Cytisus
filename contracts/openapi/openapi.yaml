openapi: 3.1.0
info:
  title: Cytisus API
  version: 0.5.0
  description: Shared client contract for deterministic Paper Securities, simulated banking, and a custodial simulated Crypto vertical slice with explicit USD routing legs.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: https://api.{environment}.cytisus.invalid
    description: Environment placeholder; a real production domain requires human approval.
    variables:
      environment:
        default: local
        enum: [local, test, staging, production]
tags:
  - name: Operations
    description: Process health and operational readiness.
  - name: Paper registration
    description: Synthetic, non-production account fixtures.
  - name: Market data
    description: Searchable instruments and honestly labeled quote fixtures.
  - name: Paper orders
    description: Idempotent simulated order and replay commands.
  - name: Portfolio
    description: Ledger-backed cash dimensions and fill-derived positions.
  - name: Bank accounts
    description: Synthetic same-name ownership and closed-loop bank account controls.
  - name: Bank transfers
    description: Simulated ACH, USD Wire, and bank withdrawal state machines.
  - name: Compliance admin
    description: Isolated local admin review, maker-checker, and reconciliation controls.
  - name: Crypto
    description: Custodial simulated crypto assets, USD conversions, portfolio, deposits, and withdrawals.
  - name: Simulators
    description: Explicitly simulated provider events available only in local and test environments.
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Return API process health
      security: []
      tags: [Operations]
      responses:
        "200":
          description: API process is healthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "405":
          description: The endpoint only accepts GET requests.
  /v1/paper/registrations:
    post:
      operationId: registerPaperFixture
      summary: Create or replay a synthetic paper registration fixture
      description: Available only in local and test environments. The returned bearer token represents synthetic data and must be kept in memory by clients.
      security: []
      tags: [Paper registration]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaperRegistrationRequest"
      responses:
        "200":
          description: Existing fixture replayed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaperRegistrationResponse"
        "201":
          description: Paper fixture created and funded through the Ledger.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaperRegistrationResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/instruments:
    get:
      operationId: searchInstruments
      summary: Search U.S. listed instrument fixtures and capabilities
      security: []
      tags: [Market data]
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Instruments and their explicit paper-trading capabilities.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Instrument"
        "400":
          $ref: "#/components/responses/InvalidRequest"
  /v1/market-data/quotes/{symbol}:
    get:
      operationId: getQuote
      summary: Return a labeled deterministic quote
      description: The Paper Securities provider emits SIMULATED, STALE, or UNAVAILABLE; it never claims real-time data.
      security: []
      tags: [Market data]
      parameters:
        - $ref: "#/components/parameters/Symbol"
        - name: replay_cursor
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
      responses:
        "200":
          description: Quote with source status and observation time.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/orders:
    get:
      operationId: listPaperOrders
      summary: List paper orders and fills
      tags: [Paper orders]
      parameters:
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Authenticated paper account orders.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Order"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: submitPaperOrder
      summary: Submit a market or limit paper order
      description: Common stocks and ETFs are tradable. The initial deterministic execution may be a partial fill.
      tags: [Paper orders]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitOrderRequest"
      responses:
        "201":
          description: Order accepted by the simulated broker.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "503":
          $ref: "#/components/responses/Unavailable"
        "504":
          $ref: "#/components/responses/ProviderTimeout"
  /v1/orders/{order_id}/replay:
    post:
      operationId: advancePaperOrderReplay
      summary: Advance one deterministic broker replay step
      tags: [Paper orders]
      parameters:
        - $ref: "#/components/parameters/OrderID"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Updated order after one deterministic replay step.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "504":
          $ref: "#/components/responses/ProviderTimeout"
  /v1/orders/{order_id}/cancel:
    post:
      operationId: cancelPaperOrder
      summary: Cancel an open or partially filled paper order
      tags: [Paper orders]
      parameters:
        - $ref: "#/components/parameters/OrderID"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Cancelled order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/positions:
    get:
      operationId: listPaperPositions
      summary: List fill-derived positions with simulated valuation
      tags: [Portfolio]
      responses:
        "200":
          description: Current non-zero paper positions.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Position"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/portfolio:
    get:
      operationId: getPaperPortfolio
      summary: Return Ledger-backed cash dimensions and fill-derived positions
      tags: [Portfolio]
      responses:
        "200":
          description: Paper portfolio. Provisional buying power is intentionally separate from settled and withdrawable cash.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Portfolio"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/banks/accounts:
    get:
      operationId: listBankAccounts
      summary: List synthetic bank accounts in withdrawal preference order
      tags: [Bank accounts]
      responses:
        "200":
          description: Accounts funded successfully appear before new accounts.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, mode]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/BankAccount"
                  mode:
                    type: string
                    const: SIMULATED
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: linkBankAccount
      summary: Link a synthetic bank account for ownership verification
      tags: [Bank accounts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkBankAccountRequest"
      responses:
        "201":
          description: Synthetic bank account linked. New same-name accounts remain pending until ownership verification.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankAccount"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/transfers/funding:
    get:
      operationId: listBankFundingTransfers
      summary: List simulated ACH and USD Wire funding transfers
      tags: [Bank transfers]
      parameters:
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Funding transfers with explicit unsettled or settled state.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, mode]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/FundingTransfer"
                  mode:
                    type: string
                    const: SIMULATED
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: initiateBankFunding
      summary: Initiate simulated ACH or issue USD Wire instructions
      description: ACH starts in pending and cannot increase settled, withdrawable, crypto, or card-spendable cash before settlement. Wire credits only after confirmed receipt and ownership checks.
      tags: [Bank transfers]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InitiateFundingRequest"
      responses:
        "201":
          description: Simulated funding transfer created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FundingTransfer"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "504":
          $ref: "#/components/responses/ProviderTimeout"
  /v1/transfers/withdrawals:
    get:
      operationId: listBankWithdrawals
      summary: List closed-loop withdrawal requests and next actions
      tags: [Bank transfers]
      parameters:
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Withdrawals with user-safe reason codes, cooling dates, and next actions.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, mode]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/BankWithdrawal"
                  mode:
                    type: string
                    const: SIMULATED
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: requestBankWithdrawal
      summary: Request a closed-loop same-name bank withdrawal
      description: Omitting bank_account_id selects the most recently successful same-name funding account. Third-party withdrawals are permanently disabled in MVP.
      tags: [Bank transfers]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BankWithdrawalRequest"
      responses:
        "201":
          description: Withdrawal created in its applicable security, review, approval, or bank state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankWithdrawal"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "504":
          $ref: "#/components/responses/ProviderTimeout"
  /internal/v1/simulators/bank/events:
    post:
      operationId: applySimulatedBankEvent
      summary: Apply a deterministic local bank provider event
      description: Local/test only. Duplicate provider and external event identifiers replay without repeating Ledger effects.
      security: []
      tags: [Simulators]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SimulatedBankEventRequest"
      responses:
        "200":
          description: Updated bank account, funding transfer, or withdrawal.
          content:
            application/json:
              schema:
                type: object
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "409":
          $ref: "#/components/responses/Conflict"
  /internal/v1/admin/compliance/cases:
    get:
      operationId: listBankComplianceCases
      summary: List bank withdrawal and transaction-monitoring cases
      security:
        - adminID: []
          adminRole: []
      tags: [Compliance admin]
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Authorized admin case queue.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ComplianceCase"
        "403":
          $ref: "#/components/responses/Forbidden"
  /internal/v1/admin/compliance/cases/{case_id}/proposals:
    post:
      operationId: proposeBankCaseReview
      summary: Create an evidenced maker proposal for a bank case
      security:
        - adminID: []
          adminRole: []
      tags: [Compliance admin]
      parameters:
        - $ref: "#/components/parameters/CaseID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewProposalRequest"
      responses:
        "201":
          description: Proposal awaiting an independent checker.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewProposal"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /internal/v1/admin/compliance/proposals/{proposal_id}/decisions:
    post:
      operationId: decideBankCaseReview
      summary: Independently approve or reject a maker proposal
      security:
        - adminID: []
          adminRole: []
      tags: [Compliance admin]
      parameters:
        - $ref: "#/components/parameters/ProposalID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewDecisionRequest"
      responses:
        "200":
          description: Recorded checker decision and, when approved, transactional withdrawal effect.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewProposal"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /internal/v1/admin/reconciliation/banks:
    post:
      operationId: reconcileBankCash
      summary: Reconcile bank provider totals to banking-related Ledger cash
      security:
        - adminID: []
          adminRole: []
      tags: [Compliance admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BankReconciliationRequest"
      responses:
        "200":
          description: Reconciliation result. Differences remain visible and create a compliance case.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankReconciliation"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/crypto/assets:
    get:
      operationId: listCryptoAssets
      summary: List tradable simulated crypto assets and native networks
      security: []
      tags: [Crypto]
      responses:
        "200":
          description: The twelve simulator assets. USD is the only quote and settlement currency.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CryptoAssetList"
        "400":
          $ref: "#/components/responses/InvalidRequest"
  /v1/crypto/portfolio:
    get:
      operationId: getCryptoPortfolio
      summary: Return Ledger-backed custodial crypto balances
      tags: [Crypto]
      responses:
        "200":
          description: Settled, held, and review-frozen quantities by asset.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CryptoPortfolio"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/crypto/conversions:
    get:
      operationId: listCryptoConversions
      summary: List simulated crypto conversions and explicit USD legs
      tags: [Crypto]
      parameters:
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Recent conversions with venue children, fills, fees, and price improvement.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, mode]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/CryptoConversion"
                  mode:
                    type: string
                    const: SIMULATED
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createCryptoConversion
      summary: Convert USD and crypto through executable simulated USD venues
      description: Crypto-to-crypto requests create a crypto-to-USD sell leg and a separate USD-to-crypto buy leg. Coin-to-coin venue pairs do not exist.
      tags: [Crypto]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CryptoConversionRequest"
      responses:
        "200":
          description: An idempotent replay of the original conversion.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CryptoConversion"
        "201":
          description: Conversion routed and settled through Ledger.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CryptoConversion"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "504":
          $ref: "#/components/responses/ProviderTimeout"
  /v1/crypto/conversions/{conversion_id}:
    get:
      operationId: getCryptoConversion
      summary: Get one simulated crypto conversion
      tags: [Crypto]
      parameters:
        - name: conversion_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Conversion, explicit USD legs, child orders, and fills.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CryptoConversion"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/crypto/deposit-addresses:
    get:
      operationId: listCryptoDepositAddresses
      summary: List simulated custodial deposit addresses
      tags: [Crypto]
      responses:
        "200":
          description: Active addresses generated by the custody simulator.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, mode]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/CryptoDepositAddress"
                  mode:
                    type: string
                    const: SIMULATED
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createCryptoDepositAddress
      summary: Create a simulated custodial deposit address
      tags: [Crypto]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CryptoAddressNetworkRequest"
      responses:
        "200":
          description: An idempotent replay of the existing address.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CryptoDepositAddress"
        "201":
          description: Simulated address created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CryptoDepositAddress"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/crypto/deposits:
    get:
      operationId: listCryptoDeposits
      summary: List custody deposit events and Ledger outcomes
      tags: [Crypto]
      parameters:
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Confirmed or rejected simulated deposits.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, mode]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/CryptoDeposit"
                  mode:
                    type: string
                    const: SIMULATED
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/crypto/withdrawal-addresses:
    get:
      operationId: listCryptoWithdrawalAddresses
      summary: List whitelisted crypto withdrawal addresses
      tags: [Crypto]
      responses:
        "200":
          description: Addresses with cooling, activation, and risk status.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, mode]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/CryptoWithdrawalAddress"
                  mode:
                    type: string
                    const: SIMULATED
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: addCryptoWithdrawalAddress
      summary: Add a crypto address with risk screening and dynamic cooling
      tags: [Crypto]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CryptoWithdrawalAddressRequest"
      responses:
        "200":
          description: An idempotent replay of the address request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CryptoWithdrawalAddress"
        "201":
          description: Address added in cooling or suspended state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CryptoWithdrawalAddress"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /v1/crypto/withdrawal-addresses/{address_id}/activate:
    post:
      operationId: activateCryptoWithdrawalAddress
      summary: Activate a cooled address after repeat risk screening
      tags: [Crypto]
      parameters:
        - name: address_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Address activated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CryptoWithdrawalAddress"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /v1/crypto/withdrawals:
    get:
      operationId: listCryptoWithdrawals
      summary: List simulated custodial withdrawals
      tags: [Crypto]
      parameters:
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Withdrawals with approval, broadcast, confirmation, or restored failure state.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, mode]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/CryptoWithdrawal"
                  mode:
                    type: string
                    const: SIMULATED
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: requestCryptoWithdrawal
      summary: Reserve a settled asset for simulated custodial withdrawal
      tags: [Crypto]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CryptoWithdrawalRequest"
      responses:
        "200":
          description: An idempotent replay of the withdrawal request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CryptoWithdrawal"
        "201":
          description: Withdrawal approved and asset reserved in Ledger.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CryptoWithdrawal"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "504":
          $ref: "#/components/responses/ProviderTimeout"
  /internal/v1/simulators/crypto/events:
    post:
      operationId: applySimulatedCryptoCustodyEvent
      summary: Apply an idempotent local custody callback
      description: Available only in local and test. The provider callback cannot write balances directly; the crypto application service posts Ledger mutations.
      security: []
      tags: [Simulators]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SimulatedCryptoEventRequest"
      responses:
        "200":
          description: Deposit or withdrawal callback applied or replayed.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/CryptoDeposit"
                  - $ref: "#/components/schemas/CryptoWithdrawal"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /internal/v1/admin/reconciliation/crypto:
    post:
      operationId: reconcileCryptoCustody
      summary: Reconcile custodial asset quantities to Ledger
      security:
        - adminID: []
          adminRole: []
      tags: [Compliance admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CryptoReconciliationRequest"
      responses:
        "200":
          description: Reconciliation result; differences create a visible compliance case.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CryptoReconciliation"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: OpaquePaperSession
    adminID:
      type: apiKey
      in: header
      name: X-Admin-ID
      description: Synthetic local admin identity. Production requires isolated enterprise SSO.
    adminRole:
      type: apiKey
      in: header
      name: X-Admin-Role
      description: Synthetic local role used for permission tests.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Stable key reused only for retries of the same financial command.
      schema:
        type: string
        minLength: 8
        maxLength: 256
        pattern: "^[a-zA-Z0-9][a-zA-Z0-9._:-]{7,255}$"
    OrderID:
      name: order_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Symbol:
      name: symbol
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Symbol"
    PageSize:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 20
    CaseID:
      name: case_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProposalID:
      name: proposal_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    InvalidRequest:
      description: The request did not pass schema or domain validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unauthorized:
      description: A valid paper session bearer token is required.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Forbidden:
      description: This capability is disabled in the current environment.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: The requested resource was not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Conflict:
      description: Idempotency, replay, quote, or order state conflict.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unprocessable:
      description: The account or instrument cannot execute this order.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unavailable:
      description: Required simulated market data is unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ProviderTimeout:
      description: The paper broker timed out; retry with the same idempotency key.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    Decimal:
      type: string
      description: Exact decimal string; JSON numbers and floating-point values are not accepted.
      pattern: "^-?(0|[1-9][0-9]{0,19})(\\.[0-9]{1,18})?$"
      examples: ["190.1"]
    Symbol:
      type: string
      pattern: "^[A-Z][A-Z0-9.-]{0,15}$"
      examples: [AAPL]
    QuoteStatus:
      type: string
      enum: [REAL_TIME, DELAYED, INDICATIVE, SIMULATED, STALE, UNAVAILABLE]
    HealthResponse:
      type: object
      additionalProperties: false
      required: [service, status, environment, time]
      properties:
        service:
          type: string
          const: api
        status:
          type: string
          const: ok
        environment:
          type: string
          enum: [local, test, staging, production]
        time:
          type: string
          format: date-time
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              pattern: "^[A-Z][A-Z0-9_]{2,63}$"
            message:
              type: string
            next_action:
              type: string
    PaperRegistrationRequest:
      type: object
      additionalProperties: false
      required: [fixture_id]
      properties:
        fixture_id:
          type: string
          minLength: 3
          maxLength: 128
          pattern: "^[a-z][a-z0-9._:-]{2,127}$"
    PaperRegistrationResponse:
      type: object
      additionalProperties: false
      required: [account, access_token, mode, replayed]
      properties:
        account:
          $ref: "#/components/schemas/PaperAccount"
        access_token:
          type: string
          minLength: 32
        mode:
          type: string
          const: SIMULATED
        replayed:
          type: boolean
    PaperAccount:
      type: object
      additionalProperties: false
      required: [id, fixture_id, customer_reference, initial_cash, created_at]
      properties:
        id:
          type: string
          format: uuid
        fixture_id:
          type: string
        customer_reference:
          type: string
        initial_cash:
          $ref: "#/components/schemas/Decimal"
        created_at:
          type: string
          format: date-time
    InstrumentCapability:
      type: object
      additionalProperties: false
      required:
        [
          searchable,
          quote_enabled,
          paper_tradable,
          live_tradable,
          fractional_enabled,
          transfer_out_enabled,
          rwa_mint_enabled,
          user_eligible,
          disabled_reason,
          policy_version,
        ]
      properties:
        searchable:
          type: boolean
        quote_enabled:
          type: boolean
        paper_tradable:
          type: boolean
        live_tradable:
          type: boolean
        fractional_enabled:
          type: boolean
        transfer_out_enabled:
          type: boolean
        rwa_mint_enabled:
          type: boolean
        user_eligible:
          type: boolean
        disabled_reason:
          type: [string, "null"]
        policy_version:
          type: string
    Instrument:
      type: object
      additionalProperties: false
      required:
        [
          id,
          symbol,
          display_name,
          asset_type,
          primary_exchange,
          currency,
          listed,
          capability,
        ]
      properties:
        id:
          type: string
          format: uuid
        symbol:
          $ref: "#/components/schemas/Symbol"
        display_name:
          type: string
        asset_type:
          type: string
          enum:
            [
              COMMON_STOCK,
              ETF,
              ADR,
              REIT,
              PREFERRED,
              CLOSED_END_FUND,
              ETN,
              WARRANT,
              UNIT,
              RIGHT,
              OTHER,
            ]
        primary_exchange:
          type: string
        currency:
          type: string
        listed:
          type: boolean
        capability:
          $ref: "#/components/schemas/InstrumentCapability"
    Quote:
      type: object
      additionalProperties: false
      required:
        [
          instrument_id,
          symbol,
          replay_cursor,
          bid,
          ask,
          last,
          status,
          market_status,
          observed_at,
          provider,
        ]
      properties:
        instrument_id:
          type: string
          format: uuid
        symbol:
          $ref: "#/components/schemas/Symbol"
        replay_cursor:
          type: integer
          format: int32
          minimum: 0
        bid:
          oneOf:
            - $ref: "#/components/schemas/Decimal"
            - type: "null"
        ask:
          oneOf:
            - $ref: "#/components/schemas/Decimal"
            - type: "null"
        last:
          oneOf:
            - $ref: "#/components/schemas/Decimal"
            - type: "null"
        status:
          $ref: "#/components/schemas/QuoteStatus"
        market_status:
          type: string
          enum: [PRE_MARKET, OPEN, AFTER_HOURS, CLOSED, HALTED]
        observed_at:
          type: string
          format: date-time
        provider:
          type: string
    SubmitOrderRequest:
      type: object
      additionalProperties: false
      required: [symbol, side, order_type, time_in_force, quantity]
      properties:
        symbol:
          $ref: "#/components/schemas/Symbol"
        side:
          type: string
          enum: [BUY, SELL]
        order_type:
          type: string
          enum: [MARKET, LIMIT]
        time_in_force:
          type: string
          enum: [DAY, GTC]
        quantity:
          $ref: "#/components/schemas/Decimal"
        limit_price:
          oneOf:
            - $ref: "#/components/schemas/Decimal"
            - type: "null"
    Fill:
      type: object
      additionalProperties: false
      required:
        [
          id,
          external_event_id,
          sequence,
          quantity,
          price,
          consideration,
          occurred_at,
        ]
      properties:
        id:
          type: string
          format: uuid
        external_event_id:
          type: string
        sequence:
          type: integer
          format: int32
          minimum: 1
        quantity:
          $ref: "#/components/schemas/Decimal"
        price:
          $ref: "#/components/schemas/Decimal"
        consideration:
          $ref: "#/components/schemas/Decimal"
        occurred_at:
          type: string
          format: date-time
    Order:
      type: object
      additionalProperties: false
      required:
        [
          id,
          symbol,
          side,
          order_type,
          time_in_force,
          quantity,
          limit_price,
          status,
          rejection_code,
          filled_quantity,
          average_fill_price,
          reference_price,
          quote_status,
          quote_observed_at,
          replay_cursor,
          provider_order_id,
          deterministic_replay,
          created_at,
          updated_at,
          fills,
        ]
      properties:
        id:
          type: string
          format: uuid
        symbol:
          $ref: "#/components/schemas/Symbol"
        side:
          type: string
          enum: [BUY, SELL]
        order_type:
          type: string
          enum: [MARKET, LIMIT]
        time_in_force:
          type: string
          enum: [DAY, GTC]
        quantity:
          $ref: "#/components/schemas/Decimal"
        limit_price:
          oneOf:
            - $ref: "#/components/schemas/Decimal"
            - type: "null"
        status:
          type: string
          enum:
            [
              PENDING_SUBMISSION,
              OPEN,
              PARTIALLY_FILLED,
              FILLED,
              CANCELLED,
              REJECTED,
              EXPIRED,
            ]
        rejection_code:
          type: [string, "null"]
        filled_quantity:
          $ref: "#/components/schemas/Decimal"
        average_fill_price:
          oneOf:
            - $ref: "#/components/schemas/Decimal"
            - type: "null"
        reference_price:
          $ref: "#/components/schemas/Decimal"
        quote_status:
          $ref: "#/components/schemas/QuoteStatus"
        quote_observed_at:
          type: string
          format: date-time
        replay_cursor:
          type: integer
          format: int32
          minimum: 0
        provider_order_id:
          type: string
        deterministic_replay:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        fills:
          type: array
          items:
            $ref: "#/components/schemas/Fill"
    Position:
      type: object
      additionalProperties: false
      required:
        [
          symbol,
          quantity,
          average_cost,
          cost_basis,
          realized_pnl,
          market_price,
          market_value,
          quote_status,
          updated_at,
        ]
      properties:
        symbol:
          $ref: "#/components/schemas/Symbol"
        quantity:
          $ref: "#/components/schemas/Decimal"
        average_cost:
          $ref: "#/components/schemas/Decimal"
        cost_basis:
          $ref: "#/components/schemas/Decimal"
        realized_pnl:
          $ref: "#/components/schemas/Decimal"
        market_price:
          $ref: "#/components/schemas/Decimal"
        market_value:
          $ref: "#/components/schemas/Decimal"
        quote_status:
          $ref: "#/components/schemas/QuoteStatus"
        updated_at:
          type: string
          format: date-time
    CashSummary:
      type: object
      additionalProperties: false
      required:
        [settled, withdrawable, provisional_buying_power, total_buying_power]
      properties:
        settled:
          $ref: "#/components/schemas/Decimal"
        withdrawable:
          $ref: "#/components/schemas/Decimal"
        provisional_buying_power:
          $ref: "#/components/schemas/Decimal"
        total_buying_power:
          $ref: "#/components/schemas/Decimal"
    Portfolio:
      type: object
      additionalProperties: false
      required: [cash, positions]
      properties:
        cash:
          $ref: "#/components/schemas/CashSummary"
        positions:
          type: array
          items:
            $ref: "#/components/schemas/Position"
    LinkBankAccountRequest:
      type: object
      additionalProperties: false
      required:
        [external_account_reference, rail_support, owner_relation, risk_class]
      properties:
        external_account_reference:
          type: string
          minLength: 3
          maxLength: 128
          description: Synthetic provider token, never a real account number.
        rail_support:
          type: string
          enum: [ACH, WIRE, BOTH]
        owner_relation:
          type: string
          enum: [SAME_NAME, THIRD_PARTY]
        risk_class:
          type: string
          enum: [STANDARD, ELEVATED]
    BankAccount:
      type: object
      additionalProperties: false
      required:
        [
          id,
          provider,
          external_account_reference,
          rail_support,
          owner_relation,
          ownership_status,
          status,
          preferred_for_withdrawal,
          successfully_funded_at,
          cooling_until,
          created_at,
          mode,
        ]
      properties:
        id:
          type: string
          format: uuid
        provider:
          type: string
        external_account_reference:
          type: string
        rail_support:
          type: string
          enum: [ACH, WIRE, BOTH]
        owner_relation:
          type: string
          enum: [SAME_NAME, THIRD_PARTY]
        ownership_status:
          type: string
          enum: [PENDING, VERIFIED, FAILED]
        status:
          type: string
          enum: [ACTIVE, BLOCKED, CLOSED]
        preferred_for_withdrawal:
          type: boolean
        successfully_funded_at:
          type: [string, "null"]
          format: date-time
        cooling_until:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
        mode:
          type: string
          const: SIMULATED
    InitiateFundingRequest:
      type: object
      additionalProperties: false
      required: [bank_account_id, rail, amount]
      properties:
        bank_account_id:
          type: string
          format: uuid
        rail:
          type: string
          enum: [ACH, WIRE]
        amount:
          $ref: "#/components/schemas/Decimal"
    FundingTransfer:
      type: object
      additionalProperties: false
      required:
        [
          id,
          bank_account_id,
          rail,
          amount,
          currency,
          status,
          provider_transfer_id,
          reason_code,
          pending,
          settled,
          replayed,
          created_at,
          updated_at,
          mode,
        ]
      properties:
        id:
          type: string
          format: uuid
        bank_account_id:
          type: string
          format: uuid
        rail:
          type: string
          enum: [ACH, WIRE]
        amount:
          $ref: "#/components/schemas/Decimal"
        currency:
          type: string
          const: USD
        status:
          type: string
          enum:
            [
              INITIATED,
              PROCESSING,
              SETTLED,
              RETURNED,
              CANCELED,
              INSTRUCTIONS_ISSUED,
              FUNDS_DETECTED,
              OWNERSHIP_REVIEW,
              CREDITED,
              NAME_MISMATCH,
              MISSING_REFERENCE,
              THIRD_PARTY_FUNDS,
              RETURN_REQUIRED,
              MANUAL_REVIEW,
            ]
        provider_transfer_id:
          type: string
        reason_code:
          type: [string, "null"]
        pending:
          type: boolean
        settled:
          type: boolean
        replayed:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        mode:
          type: string
          const: SIMULATED
    BankWithdrawalRequest:
      type: object
      additionalProperties: false
      required: [amount]
      properties:
        bank_account_id:
          type: string
          format: uuid
          description: Omit to use the preferred successfully funded same-name account.
        amount:
          $ref: "#/components/schemas/Decimal"
    BankWithdrawal:
      type: object
      additionalProperties: false
      required:
        [
          id,
          bank_account_id,
          amount,
          currency,
          status,
          reason_code,
          next_action,
          compliance_case_id,
          cooling_until,
          provider_transfer_id,
          replayed,
          created_at,
          updated_at,
          mode,
        ]
      properties:
        id:
          type: string
          format: uuid
        bank_account_id:
          type: string
          format: uuid
        amount:
          $ref: "#/components/schemas/Decimal"
        currency:
          type: string
          const: USD
        status:
          type: string
          enum:
            [
              DRAFT,
              SECURITY_VERIFICATION,
              RISK_SCREENING,
              COOLING_OFF,
              APPROVED,
              SUBMITTED_TO_BANK,
              PROCESSING,
              SETTLED,
              INFORMATION_REQUIRED,
              MANUAL_REVIEW,
              SANCTIONS_HOLD,
              NAME_MISMATCH,
              REJECTED,
              RETURNED,
              CANCELED,
            ]
        reason_code:
          type: string
        next_action:
          type: string
        compliance_case_id:
          type: [string, "null"]
          format: uuid
        cooling_until:
          type: [string, "null"]
          format: date-time
        provider_transfer_id:
          type: string
        replayed:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        mode:
          type: string
          const: SIMULATED
    SimulatedBankEventRequest:
      type: object
      additionalProperties: false
      required:
        [
          mode,
          external_event_id,
          resource_type,
          resource_id,
          event_type,
          reason_code,
        ]
      properties:
        mode:
          type: string
          const: SIMULATED
        external_event_id:
          type: string
          minLength: 1
          maxLength: 255
        resource_type:
          type: string
          enum: [BANK_ACCOUNT, FUNDING, WITHDRAWAL]
        resource_id:
          type: string
          format: uuid
        event_type:
          type: string
        reason_code:
          type: string
          pattern: "^[A-Z][A-Z0-9_]{2,63}$"
    ComplianceCase:
      type: object
      additionalProperties: false
      required:
        [
          id,
          customer_reference,
          case_type,
          resource_type,
          resource_id,
          status,
          reason_code,
          next_action,
          policy_version,
          version,
          created_at,
          updated_at,
        ]
      properties:
        id:
          type: string
          format: uuid
        customer_reference:
          type: string
        case_type:
          type: string
          enum: [EDD, BANK_WITHDRAWAL_REVIEW, TRANSACTION_MONITORING_ALERT]
        resource_type:
          type: string
        resource_id:
          type: string
        status:
          type: string
          enum:
            [OPEN, INFORMATION_REQUIRED, IN_REVIEW, APPROVED, REJECTED, CLOSED]
        reason_code:
          type: string
        next_action:
          type: string
        policy_version:
          type: string
        version:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ReviewProposalRequest:
      type: object
      additionalProperties: false
      required: [action, reason_code, ticket_reference, evidence_reference]
      properties:
        action:
          type: string
          enum: [APPROVE_WITHDRAWAL, OVERRIDE_COOLING, REJECT_WITHDRAWAL]
        reason_code:
          type: string
        ticket_reference:
          type: string
        evidence_reference:
          type: string
    ReviewDecisionRequest:
      type: object
      additionalProperties: false
      required: [approve, decision_reason]
      properties:
        approve:
          type: boolean
        decision_reason:
          type: string
    ReviewProposal:
      type: object
      additionalProperties: false
      required:
        [
          id,
          case_id,
          action,
          maker_id,
          maker_role,
          reason_code,
          ticket_reference,
          evidence_reference,
          status,
          checker_id,
          checker_role,
          decision_reason,
          created_at,
          decided_at,
        ]
      properties:
        id:
          type: string
          format: uuid
        case_id:
          type: string
          format: uuid
        action:
          type: string
        maker_id:
          type: string
        maker_role:
          type: string
        reason_code:
          type: string
        ticket_reference:
          type: string
        evidence_reference:
          type: string
        status:
          type: string
          enum: [PENDING, APPROVED, REJECTED]
        checker_id:
          type: [string, "null"]
        checker_role:
          type: [string, "null"]
        decision_reason:
          type: [string, "null"]
        created_at:
          type: string
          format: date-time
        decided_at:
          type: [string, "null"]
          format: date-time
    BankReconciliationRequest:
      type: object
      additionalProperties: false
      required: [customer_reference]
      properties:
        customer_reference:
          type: string
        provider_amount:
          description: Optional synthetic override used to exercise visible difference handling.
          oneOf:
            - $ref: "#/components/schemas/Decimal"
