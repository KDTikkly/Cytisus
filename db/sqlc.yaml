version: "2"
sql:
  - engine: "postgresql"
    queries: "queries"
    schema: "migrations"
    gen:
      go:
        package: "database"
        out: "../internal/foundation/database"
        sql_package: "pgx/v5"
        emit_interface: true
        emit_json_tags: true
        omit_unused_structs: true
  - engine: "postgresql"
    queries: "queries/ledger"
    schema: "migrations"
    gen:
      go:
        package: "store"
        out: "../internal/ledger/store"
        sql_package: "pgx/v5"
        emit_interface: true
        emit_json_tags: true
        omit_unused_structs: true
        overrides:
          - db_type: "pg_catalog.numeric"
            go_type:
              import: "github.com/KDTikkly/Cytisus/internal/money"
              type: "Decimal"
